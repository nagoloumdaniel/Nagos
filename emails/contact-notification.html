<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>Nouveau message depuis le portfolio</title>
  <!--
    Modèle EmailJS : notification reçue quand un visiteur utilise le formulaire de contact.
    Variables : {{name}}, {{email}}, {{message}}, {{date}} (envoyées par Contact.jsx).
    Dans EmailJS : Email Templates > Content > Edit Content > Code Editor, coller ce fichier.
    Réglages : Subject = « Nouveau message de {{name}} », Reply To = {{email}}.
    Aucune variable ne sert d'URL ni d'attribut HTML (EmailJS échappe le texte, pas les liens).
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .bg    { background-color: #0A0A0A !important; }
      .card  { background-color: #141414 !important; border-color: #2A2A2A !important; }
      .rule  { border-color: #2A2A2A !important; }
      .ink   { color: #F5F5F5 !important; }
      .muted { color: #A3A3A3 !important; }
      .quote { border-color: #F5F5F5 !important; }
      .btn   { background-color: #F5F5F5 !important; color: #171717 !important; }
    }
    @media only screen and (max-width: 520px) {
      .pad { padding: 24px 20px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#FAFAFA;" class="bg">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
    {{name}} vous a écrit depuis votre portfolio.
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg" style="background-color:#FAFAFA;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;">

          <!-- En-tête -->
          <tr>
            <td style="padding:0 0 16px 0;font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#737373;" class="muted">
              Portfolio · Nouveau message
            </td>
          </tr>

          <!-- Carte -->
          <tr>
            <td class="card" style="background-color:#FFFFFF;border:1px solid #E5E5E5;border-radius:0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

                <tr>
                  <td class="pad" style="padding:36px 36px 28px 36px;">
                    <div style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#737373;margin:0 0 14px 0;" class="muted">
                      {{date}}
                    </div>
                    <h1 class="ink" style="margin:0;font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-0.01em;color:#171717;">
                      {{name}} vous a écrit.
                    </h1>
                  </td>
                </tr>

                <!-- Expéditeur -->
                <tr>
                  <td class="pad rule" style="padding:20px 36px;border-top:1px solid #E5E5E5;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td width="90" valign="top" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#737373;padding:3px 0;" class="muted">Nom</td>
                        <td valign="top" class="ink" style="font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.5;color:#171717;padding:0 0 10px 0;">{{name}}</td>
                      </tr>
                      <tr>
                        <td width="90" valign="top" style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#737373;padding:3px 0;" class="muted">Email</td>
                        <td valign="top" class="ink" style="font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.5;color:#171717;padding:0;">{{email}}</td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Message -->
                <tr>
                  <td class="pad rule" style="padding:28px 36px 32px 36px;border-top:1px solid #E5E5E5;">
                    <div style="font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#737373;margin:0 0 14px 0;" class="muted">Message</div>
                    <div class="quote ink" style="border-left:2px solid #171717;padding:2px 0 2px 18px;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.75;color:#171717;white-space:pre-wrap;">{{message}}</div>
                  </td>
                </tr>

                <!-- Action : répondre (le bouton de mailto utilise Reply To ; lien volontairement absent des variables) -->
                <tr>
                  <td class="pad rule" style="padding:24px 36px 36px 36px;border-top:1px solid #E5E5E5;">
                    <div class="muted" style="font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-size:13px;line-height:1.6;color:#737373;">
                      Répondez directement à cet e-mail : la réponse part vers {{name}}.
                    </div>
                  </td>
                </tr>

              </table>
            </td>
          </tr>

          <!-- Pied -->
          <tr>
            <td style="padding:20px 0 0 0;font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.08em;color:#A3A3A3;" class="muted">
              Envoyé depuis le formulaire de contact · nagoloum.vercel.app
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
