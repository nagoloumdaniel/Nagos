  <body>
    <script>
      try { if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-theme'); } catch (e) {}
      /* Barre du navigateur mobile et contrôles natifs alignés sur le thème choisi, à chaque bascule */
      (function () {
        var meta = document.querySelector('meta[name="theme-color"]');
        var sync = function () {
          var dark = document.body.classList.contains('dark-theme');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          if (meta) meta.setAttribute('content', dark ? '#080808' : '#FAFAFA');
        };
        sync();
        new MutationObserver(sync).observe(document.body, { attributes: true, attributeFilter: ['class'] });
      })();
      /* Crafting : le site reste masqué (sauf la photo) jusqu'à ce que l'animation prenne la main ; filet de sécurité à 5 s */
      try {
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('craft-pending', 'craft-on');
          setTimeout(function () { document.documentElement.classList.remove('craft-pending'); }, 5000);
        }
      } catch (e) {}
    </script>
